name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      # Runs only unit tests explicitly in the test root directory
      - run: npx glob "test/*.test.js" | xargs node --test
        env:
          NODE_ENV: test
          JWT_SECRET: dev_jwt_secret_12345
          MONGODB_URI: mongodb://localhost:27017/test_db

  backend-docker-build:
    runs-on: ubuntu-latest
    needs: backend-unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t ai-study-assistant-backend:ci ./backend

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - working-directory: frontend
        run: npm install

      - working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: /api/v1

      - name: Build frontend Docker image
        run: docker build --build-arg VITE_API_URL=/api/v1 -t ai-study-assistant-frontend:ci ./frontend