# Local development stack: backend + frontend + a local MongoDB (instead of
# Atlas) so the whole app runs with one command, no cloud accounts needed
# just to try it out. Production deployment still uses MongoDB Atlas per
# DEPLOYMENT.md — this compose file is for local dev/demo, not production.
#
# NOT VERIFIED BY AN ACTUAL RUN — no Docker daemon in the sandbox this was
# built in. Run `docker compose up --build` locally and check it before
# relying on it.
#
# Usage:
#   1. Copy .env.example (repo root) to .env and fill in GROQ_API_KEY, JWT_SECRET
#   2. docker compose up --build
#   3. Frontend: http://localhost:5173 — Backend: http://localhost:5000/api/v1/health

services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./backend
    ports:
      - "5000:5000"
    environment:
      MONGODB_URI: mongodb://mongo:27017/ai_study_assistant
      GROQ_API_KEY: ${GROQ_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: http://localhost:5173
      PORT: 5000
      SIMILARITY_THRESHOLD: ${SIMILARITY_THRESHOLD:-0.3}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      - mongo

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:5000/api/v1
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mongo_data:
