server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: any path that isn't a real static file (e.g. /dashboard,
    # /chat/abc123) serves index.html so React Router handles it client-side,
    # instead of nginx returning a 404 for routes that only exist in the SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
